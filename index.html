<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OFFER MARKETING</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;600&family=Space+Mono&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- PRELOADER -->
    <div id="preloader">
        <div class="bracket tl"></div>
        <div class="bracket tr"></div>
        <div class="bracket bl"></div>
        <div class="bracket br"></div>

        <div class="pre-logo">
            OFFER
            <div class="pre-logo-fill" id="logoFill">OFFER</div>
        </div>

        <div class="loader-ring">
            <svg viewBox="0 0 72 72">
                <circle class="ring-track" cx="36" cy="36" r="32" />
                <circle class="ring-arc a2" cx="36" cy="36" r="32" />
                <circle class="ring-arc a1" cx="36" cy="36" r="32" />
            </svg>
            <div class="ring-center-dot"></div>
        </div>

        <div class="pre-count">Loading <span id="pct">0</span>%</div>
    </div>

    <!-- PAGE -->
    <div id="page">
        <div class="hero-inner">
            <div class="logo">
                <img src="/Logotipo-OFFER-PNG-02.png" alt="Logo del proyecto">
            </div>
            <div class="eyebrow">Agencia Creativa</div>
        <h1>Conciliamos<br>Marca + Marketing</h1>
        <p class="sub">El marketing es un círculo.<br>Auténtico, redondo, organizado.<br>En Offer te ayudamos a redondear tus
            ideas.<br>Salir del caos, avanzar con fórmula y estilo</p>
        <div class="cta-row">
            <a class="btn btn-fill" href="works.html">Nuestro trabajo</a>
            <a class="btn btn-fill" href="servicios.html">Servicios</a>
            <a class="btn btn-outline" href="contact.html">Contactános</a>
        </div>
    </div>
    
    <script src="index.js"></script>
</body>

</html>
