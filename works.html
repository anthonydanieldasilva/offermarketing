<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trabajos | Offer Marketing</title>
  <link rel="stylesheet" href="works.css">
</head>

<body>


  <div class="gallery-container">
    <div class="image-box">
      <hgroup>
        <h2 id="image-title"></h2>
      </hgroup>
      <div class="image-plane" id="image-plane">
        <img id="image-element" alt="Galería">
      </div>
    </div>

    <div class="arrows">
      <button class="left"></button>
      <button class="right"></button>
    </div>



    <svg style="display: none;">
      <symbol viewBox="0 0 44 44" width="44px" height="44px" id="circle" fill="none" stroke="currentColor">
        <circle cx="22" cy="22" r="20" stroke-width="2"></circle>
      </symbol>
    </svg>
  </div>

  <footer class="footer-logo">
    <img src="/Logotipo-OFFER-PNG-02.png" alt="Logo del proyecto">
  </footer>

  <script src="works.js"></script>

</body>

</html>
