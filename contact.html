<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/contact.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contactános - OFFER MARKETING</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;600&family=Space+Mono&display=swap"
    rel="stylesheet">
</head>

<body>
  <!-- PRELOADER (same markup to keep consistency) -->
  <div id="preloader">
    <div class="bracket tl"></div>
    <div class="bracket tr"></div>
    <div class="bracket bl"></div>
    <div class="bracket br"></div>

    <div class="pre-logo">
      OFFER
      <div class="pre-logo-fill" id="logoFill">OFFER</div>
    </div>

    <div class="loader-ring">
      <svg viewBox="0 0 72 72">
        <circle class="ring-track" cx="36" cy="36" r="32" />
        <circle class="ring-arc a2" cx="36" cy="36" r="32" />
        <circle class="ring-arc a1" cx="36" cy="36" r="32" />
      </svg>
      <div class="ring-center-dot"></div>
    </div>

    <div class="pre-count">Loading <span id="pct">0</span>%</div>
  </div>

  <div id="page">
    <div class="hero-inner">
      <div class="logo">
        <img src="/Logotipo-OFFER-PNG-02.png" alt="Logo del proyecto">
      </div>

      <div class="contact-card">
        <h2>Hablemos</h2>
        <p>¿Tenés un proyecto en mente? Dejanos un mensaje.</p>
        <div class="contact-shortcut">
          <a class="btn whatsapp-link" href="https://wa.me/543755638403" target="_blank" rel="noreferrer">
            <img class="whatsapp-icon" src="/whatsapp (1).png" alt="WhatsApp">
            Escribinos por WhatsApp
          </a>
          <a class="btn instagram-link" href="https://www.instagram.com/offer.markting?igsh=d28xc2RuaDk4OGc3"
            target="_blank" rel="noreferrer">
            Seguinos en Instagram
            <img class="instagram-icon" src="/instagram.png" alt="Instagram">
          </a>
        </div>

        <p>¿Sos más del e-mail? Te leemos en:</p>
        
        <div class="email-elastic" id="emailElastic" role="button" tabindex="0">
          <span class="email-text">contacto@offermarketing.com.ar</span>
          <svg class="copy-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="white">
            <path d="M19 2h-4.18C14.4 0.84 13.3 0 12 0c-1.3 0-2.4 0.84-2.82 2H5c-1.1 0-2 0.9-2 2v16c0 1.1 0.9 2 2 2h14c1.1 0 2-0.9 2-2V4c0-1.1-0.9-2-2-2zm-7 0c0.55 0 1 0.45 1 1s-0.45 1-1 1-1-0.45-1-1 0.45-1 1-1zm7 18H5V4h2v3h10V4h2v16z"/>
          </svg>
          <span class="copy-feedback">¡Copiado!</span>
        </div>

        <div class="contact-actions">
          <a class="btn btn-outline back-link" href="index.html">Volver</a>
        </div>

      </div>

    </div>
  </div>

  <script src="index.js"></script>
</body>

</html>
